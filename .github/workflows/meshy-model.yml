name: Meshy model

# Generates an approved model in Meshy, imports it into Roblox through Open
# Cloud and opens a pull request with assets/models/<Name>.rbxm plus preview
# images. Merging that PR is the final art approval: the next deploy ships it.
# Setup: tools/meshy/README.md.
#
#   push to main changing art/meshy/<Name>.json -> runs for each changed spec
#                                                  (only when the repo variable
#                                                  MESHY_AUTO is true)
#   Actions > Meshy model > Run workflow         -> runs for the names you type
#                                                  (one job, one approval PR)

on:
  push:
    branches: [main]
    paths: ["art/meshy/*.json"]
  workflow_dispatch:
    inputs:
      model:
        description: Spec names in art/meshy/, space-separated (e.g. Santa SantaSack)
        required: true
        default: Santa
      preview_only:
        description: Shape preview only (cheap check; no Roblox upload, no PR)
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  pick:
    # Pushes only start paid Meshy runs once MESHY_AUTO=true; the Run
    # workflow button always works.
    if: github.event_name == 'workflow_dispatch' || vars.MESHY_AUTO == 'true'
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.pick.outputs.models }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          INPUT: ${{ inputs.model }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$INPUT" ]; then
            names="$INPUT"
          else
            names=$(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- 'art/meshy/*.json' | xargs -rn1 basename | sed 's/\.json$//')
          fi
          keep=""
          for n in $names; do
            [[ "$n" =~ ^[A-Za-z0-9]+$ && -f "art/meshy/$n.json" ]] || { echo "::error::No spec art/meshy/$n.json"; exit 1; }
            # Components (e.g. KrampusBasket) run with the model that includes them.
            [ "$(jq -r '.component // false' "art/meshy/$n.json")" = "true" ] || keep="$keep $n"
          done
          names="$keep"
          echo "models=$(printf '%s\n' $names | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  model:
    needs: pick
    if: needs.pick.outputs.models != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: meshy-models
      cancel-in-progress: false
    env:
      MODELS: ${{ join(fromJson(needs.pick.outputs.models), ' ') }}
    steps:
      - uses: actions/checkout@v4

      # Specs with a "meshy" block reuse finished Meshy tasks (no credits);
      # "include" components (e.g. KrampusBasket) are generated and uploaded too.
      - name: Work out the Meshy runs (models + their components)
        id: runs
        run: |
          runs=$(python3 tools/meshy/runs.py $MODELS)
          echo "Runs: $runs"
          echo "runs=$runs" >> "$GITHUB_OUTPUT"

      - name: Generate in Meshy
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
          RUNS: ${{ steps.runs.outputs.runs }}
        run: |
          for n in $RUNS; do
            python3 tools/meshy/generate.py "$n" ${{ inputs.preview_only && '--preview-only' || '' }}
          done

      - name: Keep the raw Meshy files (FBX, GLB, animations)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meshy-${{ github.run_id }}
          path: build/meshy
          if-no-files-found: ignore

      - name: Install Rokit and the pinned tools
        if: ${{ !inputs.preview_only }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # install.sh reads GITHUB_PAT; without it its release lookup is unauthenticated and hits 403 rate limits.
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          # Authenticated, and retried: parallel jobs can hit GitHub's API rate limit.
          "$HOME/.rokit/bin/rokit" authenticate github --token "$GITHUB_TOKEN" || true
          for attempt in 1 2 3; do
            "$HOME/.rokit/bin/rokit" install --no-trust-check && break
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 10))
          done

      - name: Upload to Roblox and download the import
        if: ${{ !inputs.preview_only }}
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_USER_ID: ${{ vars.ROBLOX_USER_ID }}
          ROBLOX_GROUP_ID: ${{ vars.ROBLOX_GROUP_ID }}
          RUNS: ${{ steps.runs.outputs.runs }}
        run: |
          for n in $RUNS; do
            python3 tools/meshy/upload.py "$n"
          done

      - name: Turn Meshy's clips into Roblox animations and upload them
        if: ${{ !inputs.preview_only }}
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_USER_ID: ${{ vars.ROBLOX_USER_ID }}
          ROBLOX_GROUP_ID: ${{ vars.ROBLOX_GROUP_ID }}
          RUNS: ${{ steps.runs.outputs.runs }}
        run: |
          for n in $RUNS; do
            jq -e '.animations' "art/meshy/$n.json" > /dev/null || continue
            python3 tools/meshy/anims.py "$n"
            lune run tools/meshy/anim_rbxm "$n"
            python3 tools/meshy/upload.py "$n" --animations
          done

      - name: Build assets/models/<Name>.rbxm
        if: ${{ !inputs.preview_only }}
        run: |
          for n in $MODELS; do
            lune run tools/meshy/to_rbxm "$n"
          done

      - name: Check the deploy still builds with them
        if: ${{ !inputs.preview_only }}
        run: lune run tools/deploy staging --dry-run

      - name: Stage the files for review
        if: ${{ !inputs.preview_only }}
        id: stage
        env:
          RUNS: ${{ steps.runs.outputs.runs }}
        run: |
          branch="meshy/$(echo $MODELS | tr ' ' '-')"
          [ ${#branch} -gt 60 ] && branch="meshy/run-${GITHUB_RUN_NUMBER}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "title=Approve models: $(echo $MODELS | sed 's/ /, /g')" >> "$GITHUB_OUTPUT"
          total=0
          {
            echo "body<<EOF_BODY"
            echo "Generated in Meshy from \`art/meshy/\` (run [#$GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)) and imported into Roblox through Open Cloud."
            echo
            echo "**Merging this PR approves the final models.** The next deploy puts them in \`ServerStorage.Assets\`. Close it to reject; re-run the workflow to try again."
            echo
            echo "| Model | Shape | Textured |"
            echo "| --- | --- | --- |"
            for n in $RUNS; do
              src="build/meshy/$n"; dst="art/meshy/$n"
              mkdir -p "$dst"
              cp "$src"/preview.png "$src"/refined.png "$src"/meshy.json "$src"/roblox.json "$dst"/
              [ -f "$src/summary.json" ] && cp "$src/summary.json" "$dst"/
              if [ -f "$src/rigged.glb" ]; then cp "$src/rigged.glb" "$dst/model.glb"; else cp "$src/game.glb" "$dst/model.glb"; fi
              blob="https://github.com/$GITHUB_REPOSITORY/blob/$branch/$dst"
              echo "| $n | ![preview]($blob/preview.png?raw=true) | ![refined]($blob/refined.png?raw=true) |"
              total=$((total + $(jq .total_credits "$src/meshy.json")))
            done
            echo
            echo "Rotatable models: \`art/meshy/<Name>/model.glb\` (open in any glTF viewer)."
            echo
            for n in $MODELS; do
              echo "<details><summary>$n in Roblox</summary>"
              echo
              echo '```json'
              cat "build/meshy/$n/summary.json"
              echo
              echo '```'
              echo "</details>"
            done
            echo
            echo "Meshy credits used by this run: $total. Raw FBX, GLB and animations are in the run's artifacts."
            echo "EOF_BODY"
          } >> "$GITHUB_OUTPUT"

      - name: Open the approval PR
        if: ${{ !inputs.preview_only }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ steps.stage.outputs.branch }}
          base: ${{ github.ref_name }}
          add-paths: |
            assets/models/*.rbxm
            art/meshy/**
          commit-message: "Add Meshy models: ${{ env.MODELS }} (run ${{ github.run_number }})"
          title: ${{ steps.stage.outputs.title }}
          body: ${{ steps.stage.outputs.body }}
          assignees: ${{ github.repository_owner }}
          delete-branch: true
