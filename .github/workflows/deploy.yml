name: Deploy

# Ships the game to Roblox through Open Cloud. Setup: docs/DEPLOY.md.
#
#   push to main         -> tests -> engine tests -> Staging experience
#   tag v* (v0.1.0, ...) -> tests -> engine tests -> Staging -> Production
#   Run workflow button  -> pick staging or production (production waits for
#                           the approval set on the `production` environment)
#
# Production is off until the repo variable PRODUCTION_ENABLED is true, so for
# now every route ends at Staging.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request: # verify + dry-run build only; never publishes
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy (production always goes through staging first)
        type: choice
        options: [staging, production]
        default: staging
      restart_servers:
        description: Restart live servers afterwards (kicks players mid-run)
        type: boolean
        default: false
      skip_smoke:
        description: Skip the pre-publish smoke test in a real Roblox server
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit and the pinned tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          "$HOME/.rokit/bin/rokit" install --no-trust-check

      - name: Format and lint
        run: |
          stylua --check src tests tools/deploy.luau
          selene src

      - name: Lune tests
        run: lune run tests/runner

      - name: Build both environments (dry run, no upload)
        run: |
          lune run tools/deploy staging --dry-run
          lune run tools/deploy production --dry-run

  engine:
    # In-engine Jest Roblox specs (tests/engine, from the Jest Roblox PR) in a
    # real Roblox server on the private test place. Gates every deploy once
    # the test place is configured; until then (or before that PR is merged)
    # the steps are skipped and the deploy carries on.
    needs: verify
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the test place is configured
        env:
          HAS_VARS: ${{ vars.ROBLOX_UNIVERSE_ID != '' && (vars.ROBLOX_TEST_PLACE_ID || vars.ROBLOX_PLACE_ID) != '' }}
        run: |
          if [ "$HAS_VARS" = "true" ] && [ -f tools/ocale.luau ]; then
            echo "CONFIGURED=true" >> "$GITHUB_ENV"
          else
            echo "CONFIGURED=false" >> "$GITHUB_ENV"
          fi

      - name: Say why the engine tests are skipped
        if: env.CONFIGURED != 'true'
        run: echo "::notice::Engine tests skipped (needs tools/ocale.luau plus vars ROBLOX_UNIVERSE_ID and ROBLOX_TEST_PLACE_ID; docs/DEPLOY.md)"

      - name: Install Rokit and the pinned tools
        if: env.CONFIGURED == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          "$HOME/.rokit/bin/rokit" install --no-trust-check

      - name: Build the test place and run the engine specs in Open Cloud
        if: env.CONFIGURED == 'true'
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_TEST_PLACE_ID || vars.ROBLOX_PLACE_ID }}
        run: |
          wally install
          lune run tools/prepare-engine
          rojo build test.project.json -o build/engine-tests.rbxl
          lune run tools/ocale build/engine-tests.rbxl

  staging:
    needs: [verify, engine]
    # DEPLOY_ENABLED is a repo variable you set to true once the experiences
    # exist (docs/DEPLOY.md step 5), so main stays green until then.
    if: vars.DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit and the pinned tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          "$HOME/.rokit/bin/rokit" install --no-trust-check

      - name: Smoke test and publish to the Staging experience
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          # Repo variables point at Staging. The production environment
          # overrides the same three names with the live experience's ids.
          UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          LOBBY_PLACE_ID: ${{ vars.ROBLOX_LOBBY_PLACE_ID }}
          RUN_PLACE_ID: ${{ vars.ROBLOX_RUN_PLACE_ID }}
        # Staging always restarts its servers so testers land on the new build.
        run: lune run tools/deploy staging --restart ${{ inputs.skip_smoke && '--no-smoke' || '' }}

      - name: Keep the published place file
        uses: actions/upload-artifact@v4
        with:
          name: SleighHeist-staging-${{ github.sha }}
          path: build/SleighHeist-staging.rbxl

  production:
    needs: staging
    # Off until the live experience exists: set PRODUCTION_ENABLED=true then.
    if: vars.DEPLOY_ENABLED == 'true' && vars.PRODUCTION_ENABLED == 'true' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'production'))
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit and the pinned tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          "$HOME/.rokit/bin/rokit" install --no-trust-check

      - name: Smoke test and publish to the live experience
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          # Repo variables point at Staging. The production environment
          # overrides the same three names with the live experience's ids.
          UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          LOBBY_PLACE_ID: ${{ vars.ROBLOX_LOBBY_PLACE_ID }}
          RUN_PLACE_ID: ${{ vars.ROBLOX_RUN_PLACE_ID }}
        run: >-
          lune run tools/deploy production
          ${{ inputs.restart_servers && '--restart' || '' }}
          ${{ inputs.skip_smoke && '--no-smoke' || '' }}

      - name: Keep the published place file
        uses: actions/upload-artifact@v4
        with:
          name: SleighHeist-production-${{ github.sha }}
          path: build/SleighHeist-production.rbxl
